[pytest]
# Only collect the automated suite. python_ai/test_login.py is a manual
# script that calls a running server and must not be collected.
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    subprocess: test starts a separate Python process (slower)
filterwarnings =
    # Third-party / known deprecations that are not caused by the tests.
    ignore:\s*All support for the .google.generativeai. package has ended:FutureWarning
    ignore:.*CallSpec2 has been renamed:pytest.PytestRemovedIn10Warning
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
    # Pydantic class-based Config warnings are left visible on purpose (tech debt).
